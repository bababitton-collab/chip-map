name: build

# 05:30 UTC Tuesday to Saturday: after each US session has settled, and never
# on a day that follows one. The ledger is why this is daily now -- a forecast
# entered on Monday's close has a 5-session horizon that lands on a weekday,
# and a weekly build would show it locking up to six days late.
on:
  schedule:
    - cron: "30 5 * * 2-6"
  workflow_dispatch:
  # Also on push, so a change to the map, the questions or the page is served
  # when it is merged rather than on the next Saturday. The concurrency group
  # below means a push during a scheduled run queues behind it instead of
  # racing it to the same deployment.
  push:
    branches: [main]

# What deploy-pages needs, plus contents: write for the `live` branch below.
# That branch is the only thing this workflow writes to the repository: it
# never commits to main.
permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time. A manual run started while the scheduled one is still
# going would otherwise race it to the same Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The price cache. Restoring it is what makes the run incremental: with
      # it, each series is a tail fetch; without it, 138 full histories.
      # Shared across domains -- out/prices, not out/<domain>/prices -- because
      # two maps naming the same company should not download it twice.
      #
      # The key carries the map version, so adding a company to the map starts
      # a fresh cache rather than silently leaving the new symbol unpriced --
      # its parquet would be missing and only the full path creates one. The
      # date suffix rotates the cache weekly; restore-keys means a new week
      # still starts from last week's data rather than from nothing.
      - name: map version
        id: map
        run: |
          echo "v=$(python -c 'import json;print(json.load(open("data/semi/map.json"))["version"])')" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: out/prices
          key: prices-${{ steps.map.outputs.v }}-${{ steps.map.outputs.week }}
          restore-keys: |
            prices-${{ steps.map.outputs.v }}-

      # Before the build, not after. A broken build that still deploys is
      # worse than one that fails.
      - name: tests
        run: python -m pytest tests/ tools/probes/test_adr.py -q

      # QUESTIONS_URL and ANSWERS_URL are secrets, not variables: a repository
      # variable is readable by anyone who can read the repository, and these
      # two links are the product. SIGNUP_URL is a variable because it is a
      # public page anyway.
      - name: build
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          QUESTIONS_URL: ${{ secrets.QUESTIONS_URL }}
          ANSWERS_URL: ${{ secrets.ANSWERS_URL }}
          SIGNUP_URL: ${{ vars.SIGNUP_URL }}
        run: python -m chains.build_all

      # Assembles site/ and runs both gates on what will actually be served:
      # no Hebrew in the English files, and no locked question's text anywhere.
      - name: publish
        env:
          QUESTIONS_URL: ${{ secrets.QUESTIONS_URL }}
        run: python -m chains.publish_site

      # The snapshots on a branch of their own, so anything can read the
      # current one at a stable raw URL without going through Pages.
      #
      # An ORPHAN branch with a single commit, force-pushed: this is a
      # published artifact, not a history. Keeping every day's snapshot would
      # add ~200 KB a day to every clone of the repository for ever, to record
      # something the run log already records.
      - name: publish the snapshots to the live branch
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp out/semi/live.json out/semi/live_en.json "$tmp/"
          git worktree add --detach "$tmp/wt"
          cd "$tmp/wt"
          git checkout --orphan live
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp "$tmp/live.json" "$tmp/live_en.json" .
          git add live.json live_en.json
          git commit -qm "live snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin live
          wc -c live.json live_en.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
