name: mark

# 05:00 UTC Tuesday to Saturday: after each US session and its calls, and
# half an hour before the 05:30 build, so the build of the same morning
# already has the marks. Never on a Sunday or a Monday, because nothing was
# said on the day before them.
#
# It was 03:00, which is when the daily Cowork marker writes to the same
# data/<domain>/marks.json. Two writers in the same minute is a race no git
# rebase can adjudicate: each writes the whole document, so the later write
# wins on every key including the ones it never looked at. Moving to 05:00
# is the cheap half of the fix; merge_and_write in chains/mark.py is the
# half that holds even if the two ever meet again.
#
# This job runs here rather than in the scheduled cloud task it replaces for
# one reason: that task could reason but could not commit. GitHub is
# unreachable from those sessions and there is no connector with write access,
# so a mark it made had no hash, no diff and no author. The commit IS the
# record, so the job has to run where the write is.
on:
  schedule:
    - cron: "0 5 * * 2-6"
    # 23:30 UTC Monday to Friday: after the US close (20:00 UTC in summer,
    # 21:00 in winter), so a call made that evening is marked the same day.
    # The 03:00 run stays for calls that finish later than that.
    - cron: "30 23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Decide and print, write nothing"
        type: boolean
        default: true
      today:
        description: "Pretend it is this date (YYYY-MM-DD)"
        type: string
        required: false
      use_model:
        description: "Ask the model (default: leave due questions to the Cowork marker)"
        type: boolean
        default: false
      only:
        description: "One question id"
        type: string
        required: false
      force_qid:
        description: "Ask this question whatever its date (dry run only; commits nothing)"
        type: string
        required: false

# The one thing this job does that the build does not: commit to main.
permissions:
  contents: write

# Marks are appended to a single file. Two runs at once would race the same
# write, and the loser's mark would be lost behind the winner's rebase.
concurrency:
  group: marks
  cancel-in-progress: false

jobs:
  mark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Named before anything runs, so a missing key fails on a sentence a
      # person can act on rather than inside an HTTP error.
      # Only for the path that actually asks. A scheduled run makes no model
      # call, and failing it for a key it will never read would be a red
      # build about nothing.
      - name: the API key has to be here
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.use_model }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it as a repository secret (Settings -> Secrets and variables -> Actions). The job reads sources with it and cannot mark anything without it."
            exit 1
          fi
          echo "key present"

      - name: mark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          QUESTIONS_URL: ${{ secrets.QUESTIONS_URL }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          FORCE_QID: ${{ inputs.force_qid }}
        run: |
          set -euo pipefail
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          if [ -n "${{ inputs.today }}" ]; then args="$args --today ${{ inputs.today }}"; fi
          if [ -n "${{ inputs.only }}" ]; then args="$args --only ${{ inputs.only }}"; fi
          # A forced question is asked before its date, so it is never a real
          # mark: refuse it without dry_run rather than quietly adding one.
          if [ -n "${FORCE_QID}" ]; then
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "::error::force_qid runs only as a dry run; set dry_run to true"
              exit 1
            fi
            if ! [[ "${FORCE_QID}" =~ ^[a-z0-9_]+$ ]]; then
              echo "::error::force_qid must be a question id"
              exit 1
            fi
            args="$args --force ${FORCE_QID}"
          fi
          # The marker of record is the daily Cowork task; this job reports a
          # due question and leaves it alone. Asking the model is opt-in, per
          # dispatch, so re-enabling it later needs no edit here. A SCHEDULED
          # run never asks, whatever the inputs default to.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.use_model }}" = "true" ]; then
            echo "model: asking (dispatch, use_model=true)"
          else
            args="$args --no-model"
            echo "model: not asked; due questions go to the Cowork marker"
            if [ -n "${FORCE_QID}" ]; then
              echo "::error::force_qid proves the model path; set use_model to true"
              exit 1
            fi
          fi
          # Every map, one process each. A subprocess per domain rather
          # than a loop inside mark.py: each one gets CHIP_MAP_DOMAIN set for
          # its whole life, so every path helper and the question fetch
          # answer for the same map and cannot be left pointing at the
          # previous one. That is the failure publish_site shipped twice.
          #
          # One map failing does not stop the others -- a bad news source for
          # one industry must not leave another industry's answered question
          # unmarked -- but any failure makes the run red, because a green
          # tick on a job that half ran is the report nobody reads twice.
          # --force names ONE question, and a question belongs to one map.
          # Asked of a map that does not have it, mark.py raises -- so a
          # forced dry run would turn red on every other map. The list is
          # narrowed to the map that owns the id, and an id no map owns is
          # an error here rather than a run that quietly does nothing.
          doms="$(python -m chains.mark_domains "${FORCE_QID}")"
          rc=0
          for dom in $doms; do
            echo "::group::mark $dom"
            if CHIP_MAP_DOMAIN="$dom" python -m chains.mark --domain "$dom" $args; then
              echo "$dom: ok"
            else
              rc=1
              echo "::error::mark failed for $dom"
            fi
            echo "::endgroup::"
          done
          exit $rc

      # Only when the file actually moved, and never on a dry run. Rebase then
      # push, up to three times: the build may have pushed to main in between,
      # and a mark is an append that rebases cleanly.
      - name: commit the marks
        if: ${{ inputs.dry_run != true && !inputs.force_qid }}
        env:
          TODAY: ${{ inputs.today }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/*/marks.json; then
            echo "marks.json unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          day="${TODAY:-$(date -u +%Y-%m-%d)}"
          git add data/*/marks.json
          git commit -m "marks: auto ${day}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed; retrying"
            sleep 5
          done
          echo "::error::could not push the marks after three attempts"
          exit 1
