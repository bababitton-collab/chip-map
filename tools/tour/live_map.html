<script>
(function(){

const LHE = {logic:'לוגיקה',memory:'זיכרון',packaging:'אריזה',network:'רשת',power:'חשמל',cloud:'ענן'};
const LAYER_HE = {L1:'חומרי גלם',L2:'ציוד',L3:'תכנון',L4:'מעצבות',L5:'מפעל ואריזה',L6:'מערכות',L7:'ענן',L9:'חשמל'};

const cv=document.getElementById('map'), ctx=cv.getContext('2d'), tip=document.getElementById('tip'), stage=document.getElementById('stage'), panel=document.getElementById('panel');
let W=0,H=0,DPR=1, nodes=[], byId={}, edges=[], particles=[], hover=null, selected=null, sats=[], satT=0, t0=performance.now();
const pct=v=>v==null?'—':((v>0?'+':'')+(v*100).toFixed(1)+'%');
const cls=v=>v==null?'':(v<0?'neg':'pos');

function build(){
  nodes = D.nodes.map(n=>Object.assign({}, n)); byId={}; nodes.forEach(n=>byId[n.id]=n);
  edges = D.edges.filter(e=>byId[e.from]&&byId[e.to]);
  D.cps.forEach(c=>{ c.holders.forEach(h=>{ const n=byId[h.id]; if(!n) return; n.cp=n.cp||[]; n.cp.push(c); }); });
}
function layout(){
  const cols=['L1','L2','L3','L4','L5','L6','L7'];
  const padR=70, padL=110, colW=(W-padR-padL)/(cols.length-1);
  const xOf={}; cols.forEach((l,i)=>xOf[l]=W-padR-i*colW);
  const order=['logic','memory','packaging','network','cloud','power'];
  const groups={};
  nodes.forEach(n=>{ const L=n.layer==='L9'?'L9':n.layer; (groups[L]=groups[L]||[]).push(n); });
  const top=64, bottom=H-70;
  cols.forEach(L=>{
    const g=(groups[L]||[]).sort((a,b)=>order.indexOf(a.line)-order.indexOf(b.line)||(b.cap||0)-(a.cap||0));
    const n=g.length; const span=Math.min(bottom-top, n*46);
    const y0=top+(bottom-top-span)/2;
    g.forEach((nd,i)=>{ nd.x=xOf[L]; nd.y=n===1?(top+bottom)/2:y0+i*(span/(n-1||1)); });
  });
  // L9 energy: bottom band under L6/L7
  const g9=(groups['L9']||[]); const xs=[xOf['L7'],xOf['L6']];
  g9.forEach((nd,i)=>{ nd.x=xOf['L7']+ (i/(g9.length-1||1))*(xOf['L6']-xOf['L7']); nd.y=H-34; });
  nodes.forEach(n=>{ n.r = n.cap? Math.max(6, Math.min(22, 5+17*Math.sqrt(n.cap/5516))) : 6; });
}
function resize(){
  DPR=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); layout(); seedParticles();
}
function edgePath(e){ const a=byId[e.from], b=byId[e.to]; const mx=(a.x+b.x)/2; return {a,b,c1:{x:mx,y:a.y},c2:{x:mx,y:b.y}}; }
function bez(p,t){ const {a,b,c1,c2}=p; const u=1-t; return {x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x, y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}; }
function seedParticles(){
  particles=[]; edges.forEach((e,i)=>{ const n=e.crit==='high'?4:2; for(let k=0;k<n;k++) particles.push({e:i,t:Math.random(),v:0.0018+Math.random()*0.0012}); });
}
function pulseOf(n){ // returns {col, period, kind}
  if(!n.cp||!n.cp.length) return null;
  const ps=n.cp.map(c=>c.pressure).filter(v=>v!=null);
  if(!ps.length) return {col:tok('--amber'),period:2600,kind:'a'};
  const p=ps.reduce((a,b)=>a+b,0)/ps.length; const mag=Math.min(1,Math.abs(p)/0.25);
  return {col:p>0?tok('--tight'):tok('--erode'), period:2200-1400*mag, kind:p>0?'t':'e', p};
}
function draw(now){
  const T=now-t0;
  ctx.clearRect(0,0,W,H);
  // column labels
  ctx.font='11px "IBM Plex Mono", monospace'; ctx.fillStyle=tok('--ink3'); ctx.textAlign='center';
  const seen={}; nodes.forEach(n=>{ const L=n.layer; if(seen[L]||L==='L9') return; seen[L]=1; ctx.fillText(L+' · '+(LAYER_HE[L]||''), n.x, 22); });
  ctx.fillText('L9 · '+LAYER_HE.L9, (byId.gev.x+byId.ceg.x)/2, H-52);
  // edges
  const focus = selected||hover;
  edges.forEach((e,i)=>{ const p=edgePath(e); const rel=focus&&(e.from===focus.id||e.to===focus.id); ctx.beginPath(); ctx.moveTo(p.a.x,p.a.y); ctx.bezierCurveTo(p.c1.x,p.c1.y,p.c2.x,p.c2.y,p.b.x,p.b.y); ctx.strokeStyle=rel?LCOL[p.a.line]:'#ffffff14'; ctx.lineWidth=rel?1.8:1; ctx.stroke(); e._p=p; });
  // particles
  if(!REDUCED){ particles.forEach(q=>{ q.t+=q.v; if(q.t>1) q.t-=1; const e=edges[q.e]; const pt=bez(e._p,q.t); const rel=focus&&(e.from===focus.id||e.to===focus.id); ctx.beginPath(); ctx.arc(pt.x,pt.y,rel?2.4:1.6,0,7); ctx.fillStyle=LCOL[e._p.a.line]; ctx.globalAlpha=rel?1:.55; ctx.fill(); ctx.globalAlpha=1; }); }
  // satellites (opened sub-suppliers)
  if(sats.length){ const k=Math.min(1,(now-satT)/450); sats.forEach(s=>{ const x=selected.x+(s.tx-selected.x)*k, y=selected.y+(s.ty-selected.y)*k; ctx.beginPath(); ctx.moveTo(selected.x,selected.y); ctx.lineTo(x,y); ctx.strokeStyle=s.sole?tok('--tight')+'88':'#ffffff33'; ctx.lineWidth=1; ctx.stroke(); ctx.beginPath(); ctx.arc(x,y,s.tier===1?4.5:3,0,7); ctx.fillStyle=s.sole?tok('--tight'):(s.tier===1?tok('--ink2'):tok('--ink3')); ctx.fill(); s.x=x; s.y=y; if(k>=1){ ctx.font='10px "IBM Plex Mono", monospace'; ctx.fillStyle=tok('--ink3'); ctx.textAlign=s.tx>=selected.x?'left':'right'; ctx.fillText(s.label, x+(s.tx>=selected.x?7:-7), y+3); } }); }
  // nodes
  nodes.forEach(n=>{
    const pu=pulseOf(n);
    if(pu&&!REDUCED){ const ph=(T%pu.period)/pu.period; const rr=n.r+4+ph*16; ctx.beginPath(); ctx.arc(n.x,n.y,rr,0,7); ctx.strokeStyle=pu.col; ctx.globalAlpha=(1-ph)*.7; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1; }
    if(pu){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r+3,0,7); ctx.strokeStyle=pu.col; ctx.lineWidth=2; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fillStyle=tok('--bg'); ctx.fill(); ctx.lineWidth=(n===selected||n===hover)?3.5:2.2; ctx.strokeStyle=LCOL[n.line]; ctx.stroke();
    if(n.r>10){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r*.45,0,7); ctx.fillStyle=LCOL[n.line]; ctx.globalAlpha=.6; ctx.fill(); ctx.globalAlpha=1; }
    // label
    ctx.font=(n===selected||n===hover?'600 ':'')+'11px "Assistant", sans-serif'; ctx.fillStyle=(n===selected||n===hover)?tok('--ink'):tok('--ink2'); ctx.textAlign='center';
    const lbl=n.short||n.name.split(' ')[0];
    ctx.fillText(lbl, n.x, n.y+n.r+13);
  });
  requestAnimationFrame(draw);
}
function nodeAt(x,y){ let best=null,bd=1e9; nodes.forEach(n=>{ const d=Math.hypot(n.x-x,n.y-y); if(d<n.r+8&&d<bd){bd=d;best=n;} }); return best; }

function spark(px){ if(!px||!px.spark||px.spark.length<2) return '<p class="role">אין קו מחיר.</p>'; const s=px.spark, W=340,H=52; const lo=Math.min(...s),hi=Math.max(...s); const y=v=>4+(1-(v-lo)/((hi-lo)||1))*(H-8); const d=s.map((v,i)=>(i?'L':'M')+(i/(s.length-1)*W).toFixed(1)+' '+y(v).toFixed(1)).join(''); const col=s[s.length-1]>=100?tok('--erode'):tok('--tight'); return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" direction="ltr" style="direction:ltr"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"/><line x1="0" x2="${W}" y1="${y(100)}" y2="${y(100)}" stroke="#ffffff22" stroke-dasharray="3 3"/></svg><div class="r"><span>1w <b class="${cls(px.r1w)}">${pct(px.r1w)}</b></span><span>4w <b class="${cls(px.r4w)}">${pct(px.r4w)}</b></span><span>13w <b class="${cls(px.r13w)}">${pct(px.r13w)}</b></span><span>52w <b class="${cls(px.r52w)}">${pct(px.r52w)}</b></span><span style="color:var(--ink3)">${px.cur} · ${px.last}</span></div></div>`; }

function open(n){
  selected=n; stage.classList.add('open');
  const cps=n.cp||[];
  let h=`<div class="pin"><button class="close" id="pclose">סגור</button><h2>${n.name}</h2><span class="tk">${n.ticker||''}${n.sym&&n.sym!==n.ticker?' · priced as '+n.sym+(n.kind==='adr'?' (ADR)':''):''}${n.cap?' · $'+n.cap+'B':''}</span><p class="role" dir="ltr" style="text-align:start">${n.role||''}</p>${spark(n.px)}`;
  sats=[];
  cps.forEach(c=>{
    const pu=c.pressure; const kind=pu==null?'a':(pu>0?'t':'e');
    const sent = pu==null ? (c.n_chal_priced? 'למחזיק אין קו מחיר.':'אין מאתגר סחיר. הדופק כתום: אי אפשר למדוד את הלחץ בשוק.') : (pu>0? 'הנעילה מתהדקת: המחזיק עוקף את המאתגרים.' : 'הנעילה נשחקת: המאתגרים עוקפים את המחזיק.');
    h+=`<div class="cpbox"><span class="cpid">${c.id}</span><span class="cpn">${c.he}</span><p>${c.blurb}</p>
      <div class="pulse ${kind}"><i></i><div>${sent}<small>13w: holder ${pct(c.hr13)} · challengers ${pct(c.cr13)}${c.n_chal_priced?' ('+c.n_chal_priced+' priced)':''}</small></div></div></div>`;
    // sub-suppliers
    const t1=c.subs.filter(s=>s.tier===1), t2=c.subs.filter(s=>s.tier===2);
    h+=`<h3>מי מספק למחזיק · ${t1.length} ישירים, ${t2.length} מתחתיהם</h3>`;
    const row=s=>`<div class="sub ${s.tier===2?'t2':''}"><div><b>${s.name}</b>${s.sole?'<span class="badge sole">ספק יחיד</span>':''}${(!s.ticker||/^private/i.test(s.ticker))?'<span class="badge priv">פרטית</span>':''}${s.px&&s.px.r13w!=null?`<span class="badge r13">13w ${pct(s.px.r13w)}</span>`:''}</div><div class="sh">${s.share?(s.src?`<a href="${s.src}" target="_blank" rel="noopener">${s.share}</a>`:s.share):'<span style="color:var(--ink3)">אומדן</span>'}</div><div class="w">${s.what}${s.country?' · '+s.country:''}</div></div>`;
    t1.forEach(s=>{ h+=row(s); t2.filter(x=>x.to===s.id).forEach(x=>h+=row(x)); });
    t2.filter(x=>!t1.some(s=>s.id===x.to)).forEach(x=>h+=row(x));
    // satellites layout: tier1 arc on the upstream (right) side
    const all=[...t1.map(s=>({s,tier:1})),...t2.map(s=>({s,tier:2}))];
    const dirX = n.x < W-220 ? 1 : -1; // open toward the right (upstream) unless at the right edge
    const tilt = n.y > H-170 ? -0.55 : (n.y < 170 ? 0.55 : 0);
    all.forEach((o,i)=>{ const tier=o.tier; const arr=tier===1?t1:t2; const idx=arr.indexOf(o.s); const cnt=arr.length; const spread=Math.min(Math.PI*0.9, 0.28*Math.max(cnt-1,1)); const ang=tilt+(-spread/2)+(cnt>1?idx/(cnt-1):0.5)*spread; const R=tier===1?84:140; let tx=n.x+dirX*Math.cos(ang)*R, ty=n.y+Math.sin(ang)*R; ty=Math.max(40,Math.min(H-60,ty)); sats.push({tx, ty, tier, sole:o.s.sole, label:o.s.name.split(' ').slice(0,2).join(' ').slice(0,16)}); });
    // challengers
    h+=`<h3>מי מנסה לפרוץ · ${c.sigs.length}</h3>`;
    const pxBy={}; c.chal.forEach(x=>{ if(x.px) pxBy[x.name]=x.px; });
    c.sigs.forEach(s=>{ const px=pxBy[s.name]; h+=`<div class="ch"><b>${s.name}${px&&px.r13w!=null?`<span class="badge r13">13w ${pct(px.r13w)}</span>`:''}</b>${stageBar(s.stage)}<div class="sig">${s.approach?s.approach+'<br>':''}<span style="color:var(--ink3)">signal:</span> ${s.src?`<a href="${s.src}" target="_blank" rel="noopener">${s.signal}</a>`:s.signal} <small>${s.as_of||''}</small></div></div>`; });
    const nx=D.cal.filter(e=>e.cp===c.id&&e.days>=0).sort((a,b)=>a.days-b.days)[0];
    if(nx) h+=`<div class="nextcp">הבדיקה הבאה: <b>${nx.who}</b> · ${nx.he} · בעוד ${nx.days} ימים</div>`;
  });
  if(!cps.length){
    const ins=edges.filter(e=>e.to===n.id), outs=edges.filter(e=>e.from===n.id);
    if(ins.length) h+=`<h3>מקבל מ</h3>`+ins.map(e=>`<div class="sub"><div><b>${byId[e.from].name}</b></div><div></div><div class="w">${e.what}</div></div>`).join('');
    if(outs.length) h+=`<h3>מספק ל</h3>`+outs.map(e=>`<div class="sub"><div><b>${byId[e.to].name}</b></div><div></div><div class="w">${e.what}</div></div>`).join('');
  }
  h+=fundTable(n.id);
  h+='</div>';
  panel.innerHTML=h; panel.scrollTop=0; satT=performance.now();
  document.getElementById('pclose').addEventListener('click',close);
}

addEventListener('resize',()=>{ resize(); });
/* -- TOUR MODE ------------------------------------------------------------
   A camera over the map, not a second map. layout() is the page's own and is
   never reassigned: the columns, the node positions, the L9 strip and the
   edge curves are exactly what the desktop map draws. All this function does
   is (a) point a camera at the world, (b) dim/scale/flow the active node and
   its edges, (c) put a title band in the empty frame above the map, and
   (d) hide the panel, the countdown, the legend and the hover UI.

   Reached only through the single ?tour=1 check directly below it. Without
   ?tour=1 nothing here executes and the page renders as it always did. The
   live/latest read, pulseOf(), build(), layout(), edgePath() and open()'s
   satellite maths are called, never modified.

   Every frame is a pure function of one number, the elapsed second, so
   window.tourSeek(t) renders frame t identically every time -- which is what
   render_tour.py steps through.                                            */
function tour(){
  const W0=1440, H0=640;            // the world: the map at its natural size
  const LOOP = new URLSearchParams(location.search).get('loop')==='1';
  const SCRIPT=[
    {node:"shinetsu",  satellite:"sibelco_spruce_pine", sec:4.5,
     title:"Shin-Etsu",  line:"One quartz mine in North Carolina feeds every silicon wafer on Earth"},
    {node:"asml",      sec:4, title:"ASML",      line:"The only machine in the world that prints advanced chips"},
    {node:"tsmc",      sec:4, title:"TSMC",      line:"73% of all advanced chips are made in Taiwan"},
    {node:"skhynix",   sec:4, title:"SK hynix",  line:"Half of the world's HBM memory"},
    {node:"ajinomoto", sec:4, title:"Ajinomoto", line:"A Japanese food company makes 95% of the film inside every chip package"},
    {node:"nvda",      sec:8, title:"NVIDIA",    line:"Everything flows here", finale:true}
  ];
  const AT=[]; let acc=0; SCRIPT.forEach(s=>{ AT.push(+acc.toFixed(3)); acc+=s.sec; });
  const TOTAL=+acc.toFixed(3);
  window.tourTimeline=SCRIPT.map((s,i)=>({t:AT[i],node:s.node}));
  window.tourDuration=TOTAL;
  window.tourFinaleAt=AT[SCRIPT.findIndex(s=>s.finale)];

  const css=document.createElement('style');
  css.textContent=
    'html,body{overflow:hidden;background:var(--bg)}'+
    '.top,.next,.legend,.foot,.tip,.panel{display:none!important}'+
    '.stage,.stage.open{display:block!important;min-height:0!important;grid-template-columns:none!important}'+
    '.stage>div{position:static!important;min-width:0}'+
    'canvas#map{width:100vw!important;height:100vh!important;cursor:default!important;pointer-events:none!important}';
  document.head.appendChild(css);

  // -- viewport geometry --------------------------------------------------
  // Portrait: the map fits the viewport width and sits mid-frame, leaving the
  // top third empty for the type. Landscape: the same camera, but the frame is
  // short, so the type gets a reserved band and the map fills what is left.
  let VW=0, VH=0, LAND=false, MAP_CY=0, TITLE_Y=0, CAP_Y=0, BAND0=0, BAND1=0, AVAILH=0;
  function measure(){
    LAND = VW > VH;
    if(LAND){ MAP_CY=650; TITLE_Y=104; CAP_Y=178; BAND0=0;   BAND1=252; AVAILH=800; }
    else    { MAP_CY=VH/2; TITLE_Y=430; CAP_Y=512; BAND0=250; BAND1=640; AVAILH=VH-760; }
  }
  const setScreen=()=>ctx.setTransform(DPR,0,0,DPR,0,0);
  const setMap=v=>ctx.setTransform(DPR*v.s,0,0,DPR*v.s,
    DPR*(VW/2-v.cx*v.s), DPR*(MAP_CY-v.cy*v.s));
  const toScreen=(v,x,y)=>({x:VW/2+(x-v.cx)*v.s, y:MAP_CY+(y-v.cy)*v.s});

  // layout() is the page's own. All we do is hand it the world's size.
  resize=function(){
    DPR=Math.min(2,devicePixelRatio||1);
    VW=cv.clientWidth||innerWidth; VH=cv.clientHeight||innerHeight;
    cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
    W=W0; H=H0;
    layout(); seedParticles(); measure(); buildViews();
  };

  const neighbours=id=>{ const s=new Set();
    edges.forEach(e=>{ if(e.from===id) s.add(e.to); else if(e.to===id) s.add(e.from); });
    return [...s]; };

  // -- steps --------------------------------------------------------------
  let curStep=-1, satName='';
  function applyStep(i){
    if(i===curStep) return; curStep=i;
    const s=SCRIPT[i]; close(); satName='';
    if(s.satellite && byId[s.node]){
      open(byId[s.node]);                    // existing: lays the satellites out
      const cps=byId[s.node].cp||[]; let base=0, hit=-1, sub=null;
      for(const c of cps){                   // same order open() pushes them in
        const t1=c.subs.filter(x=>x.tier===1), t2=c.subs.filter(x=>x.tier===2);
        const all=t1.concat(t2), k=all.findIndex(x=>x.id===s.satellite);
        if(k>=0){ hit=base+k; sub=all[k]; break; }
        base+=all.length;
      }
      if(hit>=0 && sats[hit]){ sats=[sats[hit]];
        satName=sub.name.split('—')[0].replace(/\(/,'· ').replace(/\)/,'').trim(); }
      else { sats=[]; console.warn('[tour] satellite not in data: '+s.satellite); }
    }
  }

  // -- camera -------------------------------------------------------------
  let VIEW=[];
  function viewFor(i){
    const step=SCRIPT[i], n=byId[step.node];
    if(step.finale||!n) return {cx:W0/2, cy:H0/2, s:VW/W0};   // whole map, width-filling
    const set=[n].concat(neighbours(n.id).map(k=>byId[k]).filter(Boolean));
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    set.forEach(m=>{ x0=Math.min(x0,m.x-m.r); x1=Math.max(x1,m.x+m.r);
                     y0=Math.min(y0,m.y-m.r); y1=Math.max(y1,m.y+m.r); });
    sats.forEach(s=>{ x0=Math.min(x0,s.tx-8); x1=Math.max(x1,s.tx+8);
                      y0=Math.min(y0,s.ty-8); y1=Math.max(y1,s.ty+8); });
    const bw=(x1-x0)*1.30, bh=(y1-y0)*1.30;   // 15% pad on each side
    return {cx:(x0+x1)/2, cy:(y0+y1)/2,
            s:Math.min(VW/Math.max(60,bw), AVAILH/Math.max(60,bh))};
  }
  function buildViews(){
    const keep=curStep;
    VIEW=SCRIPT.map((s,i)=>{ applyStep(i); return viewFor(i); });
    curStep=-1; applyStep(keep<0?0:keep);
  }
  const ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function camAt(i,rel){
    const cur=VIEW[i];
    if(i===0||rel>=0.6) return cur;
    const p=ez(rel/0.6), pv=VIEW[i-1];       // scale glides in log space
    return {cx:pv.cx+(cur.cx-pv.cx)*p, cy:pv.cy+(cur.cy-pv.cy)*p,
            s:Math.exp(Math.log(pv.s)+(Math.log(cur.s)-Math.log(pv.s))*p)};
  }

  // -- one frame, as a pure function of the elapsed second -----------------
  function renderAt(el){
    let i=0; while(i<SCRIPT.length-1 && el>=AT[i+1]) i++;
    applyStep(i);
    const step=SCRIPT[i], rel=el-AT[i], act=byId[step.node]||null;
    const v=camAt(i,rel);
    const focus=Math.min(ez(Math.min(1,rel/0.4)), ez(Math.min(1,(step.sec-rel)/0.4)));
    const dim=step.finale?0:0.85*focus;      // finale: everyone back to full opacity

    setScreen();
    ctx.fillStyle=tok('--bg'); ctx.fillRect(0,0,VW,VH);
    setMap(v);

    const lit=act?edges.filter(e=>e.from===act.id||e.to===act.id):[];
    const isLit=new Set(lit);
    edges.forEach(e=>{ const p=edgePath(e); e._tp=p; if(isLit.has(e)) return;
      ctx.globalAlpha=(1-dim)*0.5; ctx.beginPath(); ctx.moveTo(p.a.x,p.a.y);
      ctx.bezierCurveTo(p.c1.x,p.c1.y,p.c2.x,p.c2.y,p.b.x,p.b.y);
      ctx.strokeStyle='#ffffff26'; ctx.lineWidth=1/v.s*1.4; ctx.stroke(); });
    ctx.globalAlpha=1;

    const litA=Math.max(0.3,focus), LW=2.6/v.s;
    lit.forEach(e=>{ const p=e._tp; ctx.beginPath(); ctx.moveTo(p.a.x,p.a.y);
      ctx.bezierCurveTo(p.c1.x,p.c1.y,p.c2.x,p.c2.y,p.b.x,p.b.y);
      ctx.strokeStyle=LCOL[p.a.line]; ctx.lineWidth=LW; ctx.globalAlpha=litA; ctx.stroke(); });
    ctx.globalAlpha=1;

    // flow dots: 5px on the frame whatever the zoom, 3x the map's normal speed
    const DOTR=5/v.s, nd=step.finale?12:5;
    lit.forEach((e,ei)=>{ const p=e._tp;
      for(let k=0;k<nd;k++){ const t=((el*0.36)+(k/nd)+ei*0.013)%1, pt=bez(p,t);
        ctx.beginPath(); ctx.arc(pt.x,pt.y,DOTR,0,7);
        ctx.fillStyle=LCOL[p.a.line]; ctx.globalAlpha=litA; ctx.fill(); } });
    ctx.globalAlpha=1;

    if(sats.length && act){ const k=Math.min(1,Math.max(0,rel/0.45));
      sats.forEach(s=>{ const x=act.x+(s.tx-act.x)*k, y=act.y+(s.ty-act.y)*k;
        ctx.globalAlpha=focus;
        ctx.beginPath(); ctx.moveTo(act.x,act.y); ctx.lineTo(x,y);
        ctx.strokeStyle=tok('--amber'); ctx.lineWidth=2/v.s; ctx.stroke();
        ctx.beginPath(); ctx.arc(x,y,7/v.s,0,7); ctx.fillStyle=tok('--amber'); ctx.fill();
        ctx.globalAlpha=1; s.x=x; s.y=y; }); }

    nodes.forEach(n=>{ if(act&&n.id===act.id) return;   // circles only, no labels
      ctx.globalAlpha=1-dim;
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fillStyle=tok('--bg'); ctx.fill();
      ctx.lineWidth=2.4/v.s; ctx.strokeStyle=LCOL[n.line]; ctx.stroke();
      if(n.r>10){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r*.45,0,7);
        ctx.fillStyle=LCOL[n.line]; ctx.globalAlpha=(1-dim)*.6; ctx.fill(); }
      ctx.globalAlpha=1; });
    if(act){ const r=act.r*(1+0.6*focus);
      ctx.shadowColor=LCOL[act.line]; ctx.shadowBlur=44*focus/v.s;
      ctx.beginPath(); ctx.arc(act.x,act.y,r,0,7); ctx.fillStyle=tok('--bg'); ctx.fill();
      ctx.lineWidth=4/v.s; ctx.strokeStyle=LCOL[act.line]; ctx.stroke();
      ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(act.x,act.y,r*.45,0,7);
      ctx.fillStyle=LCOL[act.line]; ctx.globalAlpha=.75; ctx.fill(); ctx.globalAlpha=1; }

    // -- type, in frame pixels: 72 and 40 mean 72 and 40 ------------------
    setScreen(); ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    if(satName && sats.length && act && focus>0.02){
      const f=toScreen(v, sats[0].x, sats[0].y);
      ctx.globalAlpha=focus; ctx.direction='ltr';
      ctx.font='600 40px "Assistant", system-ui, sans-serif'; ctx.fillStyle=tok('--amber');
      ctx.textAlign=f.x>VW/2?'right':'left';
      ctx.shadowColor=tok('--bg'); ctx.shadowBlur=14;
      ctx.fillText(satName, f.x+(f.x>VW/2?-26:26), f.y+14, VW*0.55);
      ctx.shadowBlur=0; ctx.textAlign='center'; ctx.globalAlpha=1;
    }
    if(step.finale){                    // names light up as the flow reaches them
      const nb=neighbours('nvda');
      ctx.font='600 40px "Assistant", system-ui, sans-serif'; ctx.direction='ltr';
      ctx.shadowColor=tok('--bg');
      nb.forEach((id,k)=>{ const m=byId[id]; if(!m) return;
        const u=rel-(1.2+k*0.22); if(u<0||u>1.1) return;
        ctx.globalAlpha=u<0.15?u/0.15:(u>0.8?Math.max(0,(1.1-u)/0.3):1);
        const f=toScreen(v,m.x,m.y), lbl=m.short||m.name.split(' ')[0], off=m.r*v.s;
        // columns stack vertically 46px apart, which is closer than the type is
        // tall -- so on the outer columns the name goes beside the node, not
        // above it, and only the middle of the map labels overhead.
        let lx=f.x, ly=f.y-off-18;
        if(f.x<VW*0.35){ ctx.textAlign='left';  lx=f.x+off+14; ly=f.y+14; }
        else if(f.x>VW*0.65){ ctx.textAlign='right'; lx=f.x-off-14; ly=f.y+14; }
        else ctx.textAlign='center';
        ctx.fillStyle=tok('--ink'); ctx.shadowBlur=14;
        ctx.fillText(lbl, lx, ly, 300); ctx.fillText(lbl, lx, ly, 300);
        ctx.textAlign='center'; ctx.globalAlpha=1; });
      ctx.shadowBlur=0;
    }
    if(focus>0.01){
      ctx.globalAlpha=focus*0.92;
      const g=ctx.createLinearGradient(0,BAND0,0,BAND1);
      g.addColorStop(0,'#0d1117'+(LAND?'ef':'00')); g.addColorStop(.3,'#0d1117ef');
      g.addColorStop(.72,'#0d1117ef'); g.addColorStop(1,'#0d111700');
      ctx.fillStyle=g; ctx.fillRect(0,BAND0,VW,BAND1-BAND0);
      ctx.globalAlpha=focus;
      ctx.direction='ltr'; ctx.font='700 72px "Assistant", system-ui, sans-serif';
      ctx.fillStyle=tok('--ink'); ctx.fillText(step.title, VW/2, TITLE_Y, VW-100);
      ctx.font='40px "Assistant", system-ui, sans-serif';   // band is LTR throughout
      ctx.fillStyle=tok('--ink2'); ctx.fillText(step.line, VW/2, CAP_Y, VW-80);
      ctx.globalAlpha=1;
    }
  }

  // -- clock: live loop, or parked while a renderer seeks -----------------
  let T0=null, seek=null, logged=-1;
  window.tourSeek=function(t){
    seek=Math.max(0, Math.min(TOTAL-1e-4, +t||0));
    if(!VIEW.length) resize();
    renderAt(seek); return seek;
  };
  draw=function(now){
    if(seek!==null) return;                  // a seek parks the live loop
    if(T0==null){ T0=now;
      const miss=SCRIPT.map(s=>s.node).filter(id=>!byId[id]);
      window.tourMissing=miss;
      if(miss.length) console.warn('[tour] not in data: '+miss.join(', '));
      else console.log('[tour] all '+SCRIPT.length+' script nodes found in data');
      console.log('[tour] duration '+TOTAL+'s · finale at '+window.tourFinaleAt+'s');
    }
    let el=(now-T0)/1000;
    if(el>=TOTAL){ if(LOOP){ T0=now; el=0; logged=-1; } else el=TOTAL-1e-4; }
    let i=0; while(i<SCRIPT.length-1 && el>=AT[i+1]) i++;
    if(i!==logged){ logged=i; console.log('[tour] '+AT[i].toFixed(2)+'s · '+SCRIPT[i].node); }
    renderAt(el);
    requestAnimationFrame(draw);
  };
}
// the one and only gate: with no ?tour=1 nothing above ever runs
if(new URLSearchParams(location.search).get('tour')==='1') tour();
boot();
// live data: newer snapshot from the artifact database, if present
(async()=>{ try{ if(!window.claude||!claude.use) return; const db=await claude.use('db'); if(!db) return; const snap=await db.doc('live/latest').get(); const doc=snap&&(snap.data?snap.data():snap); if(doc&&doc.as_of&&doc.as_of>D.as_of&&doc.nodes){ D=doc; close(); boot(); } }catch(e){} })();
})();
</script>
